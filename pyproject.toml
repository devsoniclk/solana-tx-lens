[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-tx-lens"
version = "0.5.0"
description = "Headless transaction simulation inspector, CPI tree visualizer, pre-flight MEV guard, atomic Jito bundle simulator, and MCP server for Solana"
readme = "README.md"
authors = [{ name = "Lakshitha Dananjaya", email = "lakshitha.dananjaya.org@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Debuggers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["solana", "simulation", "cpi", "anchor", "error-decoder", "web3", "debugger", "mev", "trading-bot", "mermaid"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sol-lens = "solana_tx_lens.cli:main"

[project.urls]
Homepage = "https://github.com/devsoniclk/solana-tx-lens"
Repository = "https://github.com/devsoniclk/solana-tx-lens.git"
Issues = "https://github.com/devsoniclk/solana-tx-lens/issues"
